# AI Travel Agent — единая публичная точка входа локального стека.
# backend (FastAPI) и web (Vite dev server) слушают только внутри docker-сети;
# всё, что нужно пользователю, — этот порт (NGINX_PORT, по умолчанию 8080).
#
# Проверка конфига: docker run --rm --add-host backend:127.0.0.1 \
#   --add-host web:127.0.0.1 -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
#   -v "$PWD/nginx/proxy-backend.conf:/etc/nginx/snippets/proxy-backend.conf:ro" \
#   nginx:1.29-alpine nginx -t

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # версия nginx — лишняя информация для атакующего
    server_tokens off;

    sendfile on;
    tcp_nopush on;

    # Запросы планирования — это маленький JSON (сообщение чата, ответы на поля);
    # файлы каталога грузятся мимо HTTP (psql/COPY). 1m отсекает случайные большие
    # загрузки до того, как они займут worker.
    client_max_body_size 1m;

    # --- Rate limiting (ключ — IP клиента) ---
    # Ключ — адрес пира ($binary_remote_addr). За CDN/балансировщиком все клиенты
    # придут с одного адреса прокси: там нужны real_ip_header и список доверенных
    # прокси, иначе зона считает весь трафик одним клиентом. Локальный стек стоит
    # без промежуточного прокси, поэтому ключ честный.
    # 10m ≈ 160k адресов на зону; этого хватает dev-стеку с запасом.
    #
    # auth: 5r/s — человек логинится раз в несколько секунд; зона позволяет
    # короткие серии повторных попыток (Mini App перезапускает initData-вход),
    # но ограничивает перебор паролей с одного IP до 5 попыток/с. Это speed bump,
    # а не полноценная защита от brute force — блокировка аккаунта остаётся
    # ответственностью приложения.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    # trips: 2r/s — каждый POST /v1/trips/{id}/messages запускает LLM-ход
    # (платные токены, до 45s wall clock). Человек не пишет чаще 2 сообщений/с;
    # burst 5 поглощает двойные клики и ретраи UI, не давая сжечь бюджет.
    limit_req_zone $binary_remote_addr zone=trips:10m rate=2r/s;
    # api: 20r/s — остальные эндпоинты (runs, orders, state) это дешёвые чтения
    # из БД; страница может открыть несколько параллельных запросов. 20r/s на IP
    # заметно выше легитимного использования, но останавливает флуд/скрейпинг.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # 32 соединения на IP: браузер держит ~6 параллельных соединений на origin,
    # каждый SSE-поток планирования занимает соединение до 45s; 32 даёт запас
    # на несколько вкладок и закрывает connection-exhaustion.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # --- Сжатие ---
    # SSE (text/event-stream) намеренно не в списке: поток не буферизуется и не
    # сжимается, чтобы события доходили до клиента сразу.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain
               text/xml application/xml image/svg+xml;

    # Vite HMR и любой другой websocket через catch-all location.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Имена сервисов разрешаются docker DNS при старте nginx (compose network).
    upstream backend {
        server backend:8000;
    }
    upstream web {
        server web:5173;
    }

    server {
        listen 80;
        server_name _;

        limit_conn conn_per_ip 32;

        # --- Security headers (always — чтобы попадали и на 429/5xx) ---
        add_header X-Content-Type-Options nosniff always;
        # X-Frame-Options намеренно НЕТ: приложение работает как Telegram Mini App
        # внутри iframe. Запрет framing (DENY/SAMEORIGIN) сломал бы Mini App.
        # Вместо него CSP frame-ancestors: self + веб-версия Telegram.
        # CSP ограничен frame-ancestors: полный CSP со script-src сломал бы
        # inline-скрипты Vite dev server без nonce — это вне рамок dev-стека.
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Подсказка всем промежуточным прокси не буферизовать ответы (SSE).
        add_header X-Accel-Buffering no always;

        # 429 отдаём JSON в том же формате, что и ошибки FastAPI, а не HTML nginx.
        error_page 429 = @too_many_requests;
        location @too_many_requests {
            default_type application/json;
            charset utf-8;
            return 429 '{"detail":"Слишком много запросов, попробуйте позже"}';
        }

        # --- Backend API ---
        # Самый длинный префикс выигрывает: /v1/auth/ и /v1/trips получают свои
        # зоны, остальной /v1/ — общую.
        location /v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
            proxy_pass http://backend;
        }

        location /v1/trips {
            limit_req zone=trips burst=5 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
            proxy_pass http://backend;
        }

        location /v1/ {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
            proxy_pass http://backend;
        }

        # Пробы живости и готовности: /health/ready ждёт compose healthcheck backend.
        location /health {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
            proxy_pass http://backend;
        }

        location /docs {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
            proxy_pass http://backend;
        }

        location = /openapi.json {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/snippets/proxy-backend.conf;
            proxy_pass http://backend;
        }

        # Клиент ходит в /api/v1/... (web/src/shared/api/client.ts). Снимаем
        # префикс /api — как это делает vite proxy — и заново матчим location
        # (last), чтобы запросы прошли через те же rate-limit зоны /v1/ и их
        # нельзя было обойти через /api.
        location /api/ {
            rewrite ^/api(/.*)$ $1 last;
        }

        # --- Web (Vite dev server) + HMR websocket ---
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            # HMR-соединение живёт часами и подолгу молчит между правками файла.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}