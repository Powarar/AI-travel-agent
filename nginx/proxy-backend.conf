# Общие параметры проксирования к backend. Выделены в сниппет, чтобы SSE-настройки
# были одинаковыми во всех API location и не разъезжались при правках.
proxy_http_version 1.1;
# keepalive к upstream без websocket upgrade: API использует только HTTP/SSE.
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# SSE (POST /v1/trips/{id}/messages -> text/event-stream): ход планирования
# занимает до 45s, события должны уходить клиенту немедленно, без буфера nginx.
proxy_buffering off;
proxy_cache off;
chunked_transfer_encoding on;
# 120s — двойной запас к wall-clock лимиту хода (AGENT_WALL_CLOCK_LIMIT_MS=45s);
# молчащий дольше поток — зависший ход, соединение можно закрыть.
proxy_read_timeout 120s;
proxy_send_timeout 120s;