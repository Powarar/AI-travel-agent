name: krutieperci

x-build-root: &build-root
  context: .

x-app-network: &app-network
  networks:
    - app

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ostrovok}
      POSTGRES_USER: ${POSTGRES_USER:-ostrovok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ostrovok}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ostrovok} -d ${POSTGRES_DB:-ostrovok}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    <<: *app-network
    build:
      <<: *build-root
      dockerfile: services/backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ostrovok}:${POSTGRES_PASSWORD:-ostrovok}@postgres:5432/${POSTGRES_DB:-ostrovok}
      AGENT_URL: http://agent:8001
      HTTP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    volumes:
      - ./services/backend/app:/app/app
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    <<: *app-network
    build:
      <<: *build-root
      dockerfile: services/agent/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      BACKEND_URL: http://backend:8000
      HTTP_PORT: "8001"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${AGENT_PORT:-8011}:8001"
    volumes:
      - ./services/agent/app:/app/app
      - ./shared:/app/shared:ro
    depends_on:
      - backend

  bot:
    <<: *app-network
    build:
      <<: *build-root
      dockerfile: services/bot/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BACKEND_URL: http://backend:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./services/bot/app:/app/app
      - ./shared:/app/shared:ro
    depends_on:
      - backend
    profiles:
      - bot

  seed:
    <<: *app-network
    build:
      <<: *build-root
      dockerfile: services/backend/Dockerfile
    command: python -m scripts.seed_database
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ostrovok}:${POSTGRES_PASSWORD:-ostrovok}@postgres:5432/${POSTGRES_DB:-ostrovok}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  web:
    <<: *app-network
    build:
      <<: *build-root
      dockerfile: web/Dockerfile
    environment:
      BACKEND_ORIGIN: http://localhost:${BACKEND_PORT:-8010}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  web_node_modules:

networks:
  app:
    driver: bridge
