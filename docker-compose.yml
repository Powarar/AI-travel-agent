name: ai-travel-agent

x-build-root: &build-root
  context: .

x-app-network: &app-network
  networks:
    - app

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ostrovok}
      POSTGRES_USER: ${POSTGRES_USER:-ostrovok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ostrovok}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ostrovok} -d ${POSTGRES_DB:-ostrovok}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    <<: *app-network
    build:
      <<: *build-root
      dockerfile: services/backend/Dockerfile
    # Планирование исполняется in-process (app/api/agent_executor.py импортирует
    # services.agent.app.orchestration.runtime); отдельного agent-сервиса нет.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ostrovok}:${POSTGRES_PASSWORD:-ostrovok}@postgres:5432/${POSTGRES_DB:-ostrovok}
      HTTP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Пусто = случайный ключ на процесс (сессии не переживают рестарт backend).
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      # ход исполняет агент в процессе backend (api/agent_executor.py); fixture — заглушка
      BACKEND_EXECUTOR: ${BACKEND_EXECUTOR:-agent}
      # A local ``make up`` must be reproducible and free. A live provider is
      # enabled only through an explicit .env setting.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.aitunnel.ru/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_PARSE: ${LLM_MODEL_PARSE:-}
      LLM_MODEL_QUESTIONS: ${LLM_MODEL_QUESTIONS:-}
      LLM_MODEL_FINALISTS: ${LLM_MODEL_FINALISTS:-}
      LLM_MODEL_EXPLAIN: ${LLM_MODEL_EXPLAIN:-}
      LLM_MODEL_DIFF: ${LLM_MODEL_DIFF:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_MODEL_FALLBACK: ${RERANK_MODEL_FALLBACK:-rerank-3-lite}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-12}
      AGENT_WALL_CLOCK_LIMIT_MS: ${AGENT_WALL_CLOCK_LIMIT_MS:-45000}
      MODEL_PRICES_VERSION: ${MODEL_PRICES_VERSION:-user-rates-2026-11-05}
      MODEL_PRICES_JSON: ${MODEL_PRICES_JSON:-null}
      LLM_TEMPERATURE_EXPLAIN: ${LLM_TEMPERATURE_EXPLAIN:-0.2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.aitunnel.ru/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${LLM_API_KEY:-}}
      # подпись initData Mini App проверяется токеном бота; без него вход через Telegram отключён
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    volumes:
      - ./services/backend/app:/app/app
      - ./shared:/app/shared:ro
      - ./services/__init__.py:/app/services/__init__.py:ro
      - ./services/agent:/app/services/agent:ro
      - ./data:/app/data:ro
      - ./evaluation:/app/evaluation:ro
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # В образе нет curl: пробу готовности проверяет штатный python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  bot:
    <<: *app-network
    build:
      <<: *build-root
      dockerfile: services/bot/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BACKEND_URL: http://backend:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./services/bot/app:/app/app
      - ./shared:/app/shared:ro
    depends_on:
      - backend
    profiles:
      - bot

  web:
    <<: *app-network
    build:
      <<: *build-root
      dockerfile: web/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  # Единственная публичная точка входа: rate limiting, security headers и SSE
  # живут здесь, а backend/web/postgres публикуются только на 127.0.0.1.
  nginx:
    <<: *app-network
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy-backend.conf:/etc/nginx/snippets/proxy-backend.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  web_node_modules:

networks:
  app:
    driver: bridge
