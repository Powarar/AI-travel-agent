[alembic]
# Реальные миграции лежат внутри пакета приложения (app/db/migrations);
# путь относительный от этого файла, поэтому `alembic upgrade head` работает
# и из services/backend/ на хосте, и из /app в контейнере backend.
script_location = app/db/migrations
# DATABASE_URL берётся из окружения (см. env.py и docker-compose.yml backend.environment);
# строку подключения здесь не держим, чтобы dev-значения не попадали в образ.
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
